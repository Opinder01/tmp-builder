<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Diamond -->
  <g transform="translate(50,50) rotate(45)">
    <rect x="-34" y="-34" width="68" height="68" rx="6" ry="6" fill="#FF7A00" stroke="#000" stroke-width="3.5"/>
  </g>
  <!-- Head (large) -->
  <circle cx="39" cy="29" r="7.5" fill="#000"/>
  <!-- Wide solid body -->
  <rect x="29" y="36" width="19" height="26" rx="3" fill="#000"/>
  <!-- Left arm (thick, angled down-left) -->
  <line x1="29" y1="41" x2="18" y2="56" stroke="#000" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm (horizontal to pole) -->
  <line x1="48" y1="41" x2="63" y2="41" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <!-- Left leg (straight down, thick) -->
  <line x1="35" y1="62" x2="32" y2="75" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <!-- Right leg (straight down, thick) -->
  <line x1="42" y1="62" x2="45" y2="75" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <!-- Thin pole (full height) -->
  <line x1="64" y1="26" x2="64" y2="76" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Octagon stop sign (larger than head, upper right) -->
  <polygon points="56,18 68,18 74,24 74,34 68,40 56,40 50,34 50,24" fill="#000"/>
</svg>
