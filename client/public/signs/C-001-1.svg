<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Diamond: rotated square, orange fill, black border, transparent outside -->
  <g transform="translate(50,50) rotate(45)">
    <rect x="-33" y="-33" width="66" height="66" rx="5" ry="5" fill="#FF7A00" stroke="#000" stroke-width="3"/>
  </g>
  <!-- Head -->
  <circle cx="40" cy="30" r="6" fill="#000"/>
  <!-- Body -->
  <rect x="37" y="36" width="6" height="18" rx="2" fill="#000"/>
  <!-- Left arm (angled down) -->
  <line x1="37" y1="42" x2="29" y2="52" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm (extended to sign pole) -->
  <line x1="43" y1="40" x2="60" y2="36" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="39" y1="54" x2="35" y2="67" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <line x1="41" y1="54" x2="45" y2="67" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Sign pole -->
  <line x1="61" y1="36" x2="61" y2="70" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- Octagon stop sign (top of pole, right side, above arm) -->
  <polygon points="56,17 66,17 71,22 71,32 66,37 56,37 51,32 51,22" fill="#000"/>
</svg>
