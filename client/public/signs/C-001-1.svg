<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Diamond shape with orange fill and black border -->
  <g transform="translate(50,50) rotate(45)">
    <rect x="-34" y="-34" width="68" height="68" rx="6" ry="6" fill="#FF7A00" stroke="#000" stroke-width="3.5"/>
  </g>
  <!-- Head -->
  <circle cx="40" cy="33" r="6.5" fill="#000"/>
  <!-- Body -->
  <rect x="37" y="40" width="6" height="18" rx="2" fill="#000"/>
  <!-- Left arm (down-left) -->
  <line x1="37" y1="46" x2="29" y2="55" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right arm (to pole) -->
  <line x1="43" y1="44" x2="57" y2="44" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="39" y1="58" x2="35" y2="70" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="43" y1="58" x2="47" y2="70" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Pole -->
  <line x1="58" y1="28" x2="58" y2="72" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- Octagon stop sign (smaller, fits inside diamond) -->
  <polygon points="53,22 63,22 68,27 68,37 63,42 53,42 48,37 48,27" fill="#000"/>
</svg>
